<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashish Photo Studio - Portfolio</title>

    <style>
        /* --- GLOBAL STYLES --- */
        body {
            background-image: url('../Desktop/45/pp.jfif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            margin: 0;
            padding: 0;
            font-family: "Poppins", Arial, sans-serif;
            color: white;
            text-shadow: 1px 1px 3px black;
            backdrop-filter: blur(3px);
        }

        html {
            scroll-behavior: smooth;
        }

        /* --- NAVBAR --- */
        nav {
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 0;
            display: flex;
            justify-content: center;
            gap: 40px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #ff512f;
        }

        /* --- HERO SECTION --- */
        header {
            text-align: center;
            padding: 80px 20px 40px;
            background: rgba(0, 0, 0, 0.4);
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        header p {
            font-size: 1.2em;
            color: #ddd;
        }

        /* --- PORTFOLIO SECTION --- */
        .content {
            text-align: center;
            padding: 50px 20px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            width: 80%;
            margin: 30px auto;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .content h2 {
            font-size: 2em;
            margin-bottom: 15px;
            color: #fff;
        }

        /* --- PORTFOLIO GRID --- */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .gallery img {
            width: 100%;
            border-radius: 15px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery img:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        /* --- BUTTON --- */
        .portfolio-btn {
            background: linear-gradient(90deg, #ff512f, #dd2476);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 25px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .portfolio-btn:hover {
            transform: scale(1.08);
            background: linear-gradient(90deg, #dd2476, #ff512f);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        /* --- FOOTER --- */
        footer {
            text-align: center;
            padding: 15px;
            margin-top: 40px;
            background: rgba(0, 0, 0, 0.7);
            font-size: 0.9em;
            color: #ccc;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav>
        <a href="1.html" target="_blank">Home</a>
        <a href="services.html" target="_blank">Services</a>
        <a href="portfolio.html">Portfolio</a>
    </nav>

    <!-- HERO SECTION -->
    <header>
        <h1>Ashish Photo Studio</h1>
        <p>Capturing Emotions. Creating Memories.</p>
    </header>

    <!-- PORTFOLIO CONTENT -->
    <section class="content" id="portfolio">
        <h2>Our Portfolio</h2>
        <p>Take a look at some of our favorite work from recent sessions.</p>

        <div class="gallery">
            <img src="https://via.placeholder.com/300x200" alt="Portfolio 1">
            <img src="https://via.placeholder.com/300x200" alt="Portfolio 2">
            <img src="https://via.placeholder.com/300x200" alt="Portfolio 3">
            <img src="https://via.placeholder.com/300x200" alt="Portfolio 4">
        </div>

        <!-- BUTTON -->
        <a href="gallery.html" target="_blank">
            <button class="portfolio-btn">View Full Gallery</button>
        </a>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>© 2025 Ashish Photo Studio. All Rights Reserved.</p>
    </footer>

</body>
</html>
